# docker compose up -d --build
#
# Variables come from ./.env next to this file (see .env.example). Every port binds to 127.0.0.1 by default;
# put nginx (deploy/nginx/alpha-scanner.conf) in front for public access.
name: alpha-scanner

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://alpha:${POSTGRES_PASSWORD:-alpha}@postgres:5432/alpha
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alpha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpha}
      POSTGRES_DB: alpha
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpha"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: [./backend/.env]
    environment:
      <<: *backend-env
      RUN_SCANNER_IN_API: "false"
    volumes: ["./backend/data:/srv/data:ro"]   # smart_wallets.json; edit on the host, no rebuild
    ports: ["${API_BIND:-127.0.0.1:8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.scanner_worker"]
    env_file: [./backend/.env]
    environment: *backend-env
    volumes: ["./backend/data:/srv/data:ro"]
    depends_on:
      # The API creates the tables on startup; waiting for it avoids a create_all race on a fresh database.
      api: {condition: service_healthy}
    restart: unless-stopped

  dashboard:
    build:
      context: ./frontend
      args:
        # URL the *browser* uses for the API. Empty = same origin (nginx proxies /api and /ws).
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL-http://localhost:8000}
    ports: ["${DASHBOARD_BIND:-127.0.0.1:3000}:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
