# /etc/nginx/sites-available/scanner.da3m.io
# Dashboard on 127.0.0.1:3300, API/WebSocket on 127.0.0.1:8300 (see .env: DASHBOARD_BIND / API_BIND).
# HTTPS is added by:  certbot --nginx -d scanner.da3m.io

# Sign-in, sign-up and the private dashboards: at most 10 requests a minute per IP (the API also locks out
# after 8 wrong passwords). Everything else on /api/ is unaffected.
limit_req_zone $binary_remote_addr zone=alpha_auth:10m rate=10r/m;

map $http_upgrade $alpha_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name scanner.da3m.io;

    client_max_body_size 1m;

    # Security headers. frame-ancestors/X-Frame-Options: no page (withdrawals!) can be framed by another site.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ ^/api/me/(login|register|password|forgot|reset|2fa/[a-z]+|account/reveal-key|account/withdraw)$ {
        limit_req zone=alpha_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8300;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $alpha_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;   # server heartbeats every 25s
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
